<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Strigano{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">strigano</a>
    <span class="tagline">stego &amp; forensics triage</span>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <span>strigano v{{ version or "" }}</span>
    <span>by hex3n</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
